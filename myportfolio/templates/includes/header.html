{% load static %}

<header x-data="{ mobileMenuOpen: false }"
        class="sticky top-0 z-50 backdrop-blur-md bg-white/80 dark:bg-gray-900/80 border-b border-gray-200/60 dark:border-gray-800/60 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex justify-between items-center">
        <!-- Logo -->
        <a href="/"
            class="group flex items-center gap-2 text-lg md:text-xl font-extrabold text-white bg-gradient-to-r from-[#bd69f5] to-pink-500 px-4 py-2 rounded-xl shadow-md hover:shadow-brand-500/20 hover:scale-[1.02] transition-all">
            <i class="fa-solid fa-code text-sm"></i>
            <span>naresh.dev</span>
        </a>

        <!-- Desktop Navigation & Controls -->
        <div class="hidden md:flex items-center gap-6">
            <nav class="flex items-center gap-6 font-semibold text-sm">
                <a href="/" class="{% if request.path == '/' %} text-[#bd69f5] font-bold {% else %} text-gray-700 dark:text-gray-300 {% endif %} hover:text-[#bd69f5] dark:hover:text-[#bd69f5] transition-colors">Home</a>
                <a href="{% url 'project' %}" class="{% if request.path == '/project/' %} text-[#bd69f5] font-bold {% else %} text-gray-700 dark:text-gray-300 {% endif %} hover:text-[#bd69f5] dark:hover:text-[#bd69f5] transition-colors">Projects</a>
                <a href="{% url 'about' %}" class="{% if request.path == '/about/' %} text-[#bd69f5] font-bold {% else %} text-gray-700 dark:text-gray-300 {% endif %} hover:text-[#bd69f5] dark:hover:text-[#bd69f5] transition-colors">About</a>
                <a href="{% url 'team' %}" class="{% if request.path == '/team/' %} text-[#bd69f5] font-bold {% else %} text-gray-700 dark:text-gray-300 {% endif %} hover:text-[#bd69f5] dark:hover:text-[#bd69f5] transition-colors">Team</a>
                <a href="{% url 'contact' %}" class="{% if request.path == '/contact/' %} text-[#bd69f5] font-bold {% else %} text-gray-700 dark:text-gray-300 {% endif %} hover:text-[#bd69f5] dark:hover:text-[#bd69f5] transition-colors">Contact</a>
            </nav>

            <!-- Resume Button -->
            <a href="{% static 'Naresh-Kumar-Resume.pdf' %}" target="_blank" rel="noopener noreferrer"
               class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl border border-[#bd69f5] text-[#bd69f5] font-bold text-sm hover:bg-[#bd69f5] hover:text-white transition-all shadow-sm hover:shadow-md hover:scale-105">
                <i class="fa-solid fa-file-pdf"></i>
                <span>Resume</span>
            </a>

            <!-- Dark Mode Toggle Button -->
            <button @click="darkMode = !darkMode" 
                    aria-label="Toggle Dark Mode"
                    class="p-2 rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:text-[#bd69f5] dark:hover:text-[#bd69f5] transition-all hover:scale-110 focus:outline-none">
                <template x-if="!darkMode">
                    <i class="fa-solid fa-moon text-lg"></i>
                </template>
                <template x-if="darkMode">
                    <i class="fa-solid fa-sun text-lg text-amber-400"></i>
                </template>
            </button>
        </div>

        <!-- Mobile Hamburger Controls -->
        <div class="flex md:hidden items-center gap-3">
            <!-- Mobile Dark Mode Button -->
            <button @click="darkMode = !darkMode" 
                    aria-label="Toggle Dark Mode"
                    class="p-2 rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:text-[#bd69f5]">
                <template x-if="!darkMode">
                    <i class="fa-solid fa-moon text-lg"></i>
                </template>
                <template x-if="darkMode">
                    <i class="fa-solid fa-sun text-lg text-amber-400"></i>
                </template>
            </button>

            <!-- Hamburger Button -->
            <button @click="mobileMenuOpen = !mobileMenuOpen" 
                    aria-label="Toggle Menu"
                    class="p-2 rounded-xl text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none">
                <i class="fa-solid" :class="mobileMenuOpen ? 'fa-xmark text-xl' : 'fa-bars text-xl'"></i>
            </button>
        </div>
    </div>

    <!-- Mobile Navigation Drawer -->
    <div x-show="mobileMenuOpen" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 -translate-y-4"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 -translate-y-4"
         @click.away="mobileMenuOpen = false"
         class="md:hidden border-b border-gray-200 dark:border-gray-800 bg-white/95 dark:bg-gray-900/95 backdrop-blur-lg px-4 pt-2 pb-6 space-y-3">
        <a href="/" @click="mobileMenuOpen = false"
           class="block py-2.5 px-4 rounded-xl font-medium {% if request.path == '/' %} bg-brand-500/10 text-[#bd69f5] font-bold {% else %} text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 {% endif %} transition">Home</a>
        <a href="{% url 'project' %}" @click="mobileMenuOpen = false"
           class="block py-2.5 px-4 rounded-xl font-medium {% if request.path == '/project/' %} bg-brand-500/10 text-[#bd69f5] font-bold {% else %} text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 {% endif %} transition">Projects</a>
        <a href="{% url 'about' %}" @click="mobileMenuOpen = false"
           class="block py-2.5 px-4 rounded-xl font-medium {% if request.path == '/about/' %} bg-brand-500/10 text-[#bd69f5] font-bold {% else %} text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 {% endif %} transition">About</a>
        <a href="{% url 'team' %}" @click="mobileMenuOpen = false"
           class="block py-2.5 px-4 rounded-xl font-medium {% if request.path == '/team/' %} bg-brand-500/10 text-[#bd69f5] font-bold {% else %} text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 {% endif %} transition">Team</a>
        <a href="{% url 'contact' %}" @click="mobileMenuOpen = false"
           class="block py-2.5 px-4 rounded-xl font-medium {% if request.path == '/contact/' %} bg-brand-500/10 text-[#bd69f5] font-bold {% else %} text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 {% endif %} transition">Contact</a>
        <a href="{% static 'Naresh-Kumar-Resume.pdf' %}" target="_blank" rel="noopener noreferrer" @click="mobileMenuOpen = false"
           class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border border-[#bd69f5] text-[#bd69f5] font-bold hover:bg-[#bd69f5] hover:text-white transition">
            <i class="fa-solid fa-file-pdf"></i>
            <span>View Resume</span>
        </a>
    </div>
</header>
