{% load static %}

<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark" x-data="{ darkMode: localStorage.getItem('theme') ? localStorage.getItem('theme') === 'dark' : true }" 
      :class="{ 'dark': darkMode }" 
      x-init="$watch('darkMode', val => localStorage.setItem('theme', val ? 'dark' : 'light'))">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Naresh Dev | Portfolio {% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link rel="apple-touch-icon" href="{% static 'images/favicon.png' %}">

    <!-- SEO Meta Tags -->
    <meta name="description" content="{% block meta_description %}Naresh Kumar — Full-Stack Python & Django Developer specializing in building secure, scalable web applications and REST APIs.{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}Naresh Kumar, Naresh Dev, Python Developer, Django Developer, Full Stack Developer, REST API Developer, Web Development Portfolio{% endblock %}">
    <meta name="author" content="Naresh Kumar">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="{{ request.build_absolute_uri }}">

    <!-- Open Graph (OG) Meta Tags for Social Sharing -->
    <meta property="og:title" content="{% block og_title %}Naresh Dev — Full-Stack Python & Django Developer{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Explore web projects, technical skills, and contact Naresh Kumar for full-stack web development opportunities.{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{% static 'images/og-banner.png' %}{% endblock %}">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <meta property="og:type" content="website">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}Naresh Dev — Full-Stack Django Developer{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Full-stack Python & Django developer portfolio featuring scalable web apps and REST APIs.{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}{% static 'images/og-banner.png' %}{% endblock %}">

    <!-- Google Search & Sitelinks Structured Data (JSON-LD Schema) -->
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Naresh Dev",
        "alternateName": ["Naresh Kumar Portfolio", "Naresh Dev Portfolio"],
        "url": "{{ request.scheme }}://{{ request.get_host }}/",
        "description": "Full-Stack Python & Django Developer building scalable web applications and REST APIs.",
        "publisher": {
          "@type": "Person",
          "name": "Naresh Kumar"
        }
      },
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Naresh Kumar",
        "alternateName": "Naresh Dev",
        "jobTitle": "Full-Stack Python & Django Developer",
        "url": "{{ request.scheme }}://{{ request.get_host }}/",
        "sameAs": [
          "https://github.com/naresh-kumar28",
          "https://www.linkedin.com/in/naresh-kumar28/"
        ],
        "knowsAbout": ["Python", "Django", "Django REST Framework", "MySQL", "PostgreSQL", "HTMX", "Alpine.js", "Tailwind CSS", "Razorpay Payment Integration"]
      },
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "Site Navigation Sitelinks",
        "itemListElement": [
          {
            "@type": "SiteNavigationElement",
            "position": 1,
            "name": "Home",
            "description": "Naresh Dev official portfolio landing page",
            "url": "{{ request.scheme }}://{{ request.get_host }}/#home"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 2,
            "name": "About Me",
            "description": "Background, technical skills, and backend engineering profile",
            "url": "{{ request.scheme }}://{{ request.get_host }}/about/"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 3,
            "name": "Featured Projects",
            "description": "Full-stack web applications and live demos built with Django",
            "url": "{{ request.scheme }}://{{ request.get_host }}/projects/"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 4,
            "name": "Achievements & Certifications",
            "description": "Verified credentials, hackathon awards, and milestone achievements",
            "url": "{{ request.scheme }}://{{ request.get_host }}/achievements/"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 5,
            "name": "Contact Me",
            "description": "Get in touch with Naresh Kumar for web development opportunities",
            "url": "{{ request.scheme }}://{{ request.get_host }}/contact/"
          }
        ]
      }
    ]
    </script>

    <!-- Tailwind CSS with Dark Mode Enabled -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fbf4ff',
                            100: '#f5e6ff',
                            500: '#bd69f5',
                            600: '#a855d8',
                            700: '#8e3abf',
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Modal Custom Scrollbar Hiding Style -->
    <style>
        .modal-scrollable-content {
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
        }
        .modal-scrollable-content::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }
    </style>

    <!-- HTMX 2.0.4 -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <!-- Alpine.js 3.x -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* HTMX Loading Indicator Bar */
        .htmx-indicator-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background: linear-gradient(90deg, #bd69f5, #ec4899, #3b82f6);
            z-index: 9999;
            transition: width 0.3s ease, opacity 0.4s ease;
            opacity: 0;
        }
        .htmx-request .htmx-indicator-bar,
        .htmx-request.htmx-indicator-bar {
            width: 85%;
            opacity: 1;
        }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white"
      hx-boost="true"
      hx-indicator="#top-progress-bar">

    <!-- Top Loading Indicator for HTMX Boosted Navigation -->
    <div id="top-progress-bar" class="htmx-indicator-bar"></div>

    {% include "includes/header.html" %}

    <main id="main-content" class="flex-grow">
        {% block content %}

        {% endblock %}
    </main>

    {% include "includes/footer.html" %}

</body>

</html>
