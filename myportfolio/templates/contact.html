{% extends "base.html" %}

{% load static %}

{% block title %}Contact | Naresh Dev{% endblock %}

{% block content %}

<div class="py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto min-h-screen">
    {% include "includes/_contact_section.html" %}
</div>

<script>
    function sendWhatsAppDirect() {
        const nameInput = document.querySelector('input[name="name"]');
        const emailInput = document.querySelector('input[name="email"]');
        const contactInput = document.querySelector('input[name="contact"]');
        const messageInput = document.querySelector('textarea[name="message"]');

        const name = nameInput ? nameInput.value : '';
        const email = emailInput ? emailInput.value : '';
        const contact = contactInput ? contactInput.value : '';
        const message = messageInput ? messageInput.value : '';

        if (!name || !message) {
            alert("Please fill in your name and message first!");
            return;
        }

        const phoneNumber = "{{ WHATSAPP_NUMBER }}"; 
        const text = `Hello 👋%0AName: ${encodeURIComponent(name)}%0AEmail: ${encodeURIComponent(email)}%0AMobile: ${encodeURIComponent(contact)}%0AMessage: ${encodeURIComponent(message)}`;
        window.open(`https://wa.me/${phoneNumber}?text=${text}`, "_blank");
    }
</script>

{% endblock %}
