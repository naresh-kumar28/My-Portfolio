{% load static %}
<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: localStorage.getItem('adminTheme') === 'dark' }"
      :class="{ 'dark': darkMode }"
      x-init="$watch('darkMode', val => localStorage.setItem('adminTheme', val ? 'dark' : 'light'))">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel | Naresh Dev{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#bd69f5',
                            600: '#a855d8',
                            700: '#8e3abf',
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- HTMX & Alpine.js -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen antialiased flex"
      x-data="{ mobileSidebarOpen: false }">

    <!-- Sidebar -->
    {% include 'admin/sidebar.html' %}

    <!-- Main Wrapper -->
    <div class="flex-1 flex flex-col md:pl-64 min-h-screen w-full">

        <!-- Top Header Bar -->
        <header class="sticky top-0 z-30 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-6 py-4 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-4">
                <button @click="mobileSidebarOpen = !mobileSidebarOpen" 
                        class="md:hidden p-2 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <h1 class="text-xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
                    {% block page_title %}Dashboard Overview{% endblock %}
                </h1>
            </div>

            <div class="flex items-center gap-4">
                <a href="/" target="_blank"
                   class="hidden sm:flex items-center gap-2 text-xs font-bold bg-[#bd69f5]/15 text-[#bd69f5] px-3.5 py-2 rounded-xl hover:bg-[#bd69f5] hover:text-white transition-all">
                    <i class="fa-solid fa-globe"></i> View Website
                </a>

                <!-- Theme Toggle -->
                <button @click="darkMode = !darkMode"
                        class="p-2 rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:text-[#bd69f5] transition">
                    <i class="fa-solid" :class="darkMode ? 'fa-sun text-amber-400' : 'fa-moon'"></i>
                </button>

                <!-- Admin User Dropdown/Avatar -->
                <div class="flex items-center gap-3 border-l border-gray-200 dark:border-gray-800 pl-4">
                    <div class="w-9 h-9 rounded-full bg-gradient-to-r from-[#bd69f5] to-pink-500 text-white font-bold flex items-center justify-center text-sm shadow">
                        {{ user.username|first|upper }}
                    </div>
                    <div class="hidden sm:block">
                        <p class="text-sm font-bold leading-none text-gray-900 dark:text-white">{{ user.username }}</p>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Administrator</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8">
            {% block content %}
            {% endblock %}
        </main>
    </div>

</body>
</html>
