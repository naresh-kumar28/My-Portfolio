<!-- Sidebar for Desktop & Mobile -->
<aside x-show="mobileSidebarOpen || window.innerWidth >= 768"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="-translate-x-full"
       x-transition:enter-end="translate-x-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="translate-x-0"
       x-transition:leave-end="-translate-x-full"
       @click.away="mobileSidebarOpen = false"
       class="fixed left-0 top-0 z-40 w-64 h-screen bg-gray-900 text-gray-200 border-r border-gray-800 flex flex-col justify-between shadow-2xl">
    
    <div>
        <!-- Admin Logo Header -->
        <div class="p-6 border-b border-gray-800 flex items-center justify-between">
            <a href="{% url 'admin' %}" class="flex items-center gap-2 text-lg font-extrabold text-white">
                <span class="w-8 h-8 rounded-xl bg-gradient-to-r from-[#bd69f5] to-pink-500 flex items-center justify-center text-xs shadow-md">
                    <i class="fa-solid fa-shield-halved"></i>
                </span>
                <span>Naresh Admin</span>
            </a>

            <!-- Mobile Close Button -->
            <button @click="mobileSidebarOpen = false" class="md:hidden text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Navigation Links -->
        <nav class="p-4 space-y-1.5 font-medium text-sm">
            <a href="{% url 'admin' %}" 
               class="flex items-center gap-3 py-3 px-4 rounded-xl transition-all duration-200 {% if request.path == '/dashboard-x7k/' %} bg-gradient-to-r from-[#bd69f5] to-pink-500 text-white font-bold shadow-lg shadow-[#bd69f5]/25 {% else %} text-gray-400 hover:bg-gray-800 hover:text-white {% endif %}">
                <i class="fa-solid fa-chart-pie text-base"></i>
                <span>Dashboard</span>
            </a>

            <a href="{% url 'project-add' %}" 
               class="flex items-center gap-3 py-3 px-4 rounded-xl transition-all duration-200 {% if '/project' in request.path %} bg-gradient-to-r from-[#bd69f5] to-pink-500 text-white font-bold shadow-lg shadow-[#bd69f5]/25 {% else %} text-gray-400 hover:bg-gray-800 hover:text-white {% endif %}">
                <i class="fa-solid fa-diagram-project text-base"></i>
                <span>Projects</span>
            </a>

            <a href="{% url 'certificate-add' %}" 
               class="flex items-center gap-3 py-3 px-4 rounded-xl transition-all duration-200 {% if '/certificate' in request.path %} bg-gradient-to-r from-[#bd69f5] to-pink-500 text-white font-bold shadow-lg shadow-[#bd69f5]/25 {% else %} text-gray-400 hover:bg-gray-800 hover:text-white {% endif %}">
                <i class="fa-solid fa-certificate text-base"></i>
                <span>Certificates</span>
            </a>


            <a href="{% url 'add-skill' %}" 
               class="flex items-center gap-3 py-3 px-4 rounded-xl transition-all duration-200 {% if '/skill' in request.path %} bg-gradient-to-r from-[#bd69f5] to-pink-500 text-white font-bold shadow-lg shadow-[#bd69f5]/25 {% else %} text-gray-400 hover:bg-gray-800 hover:text-white {% endif %}">
                <i class="fa-solid fa-code text-base"></i>
                <span>Skills</span>
            </a>

            <a href="{% url 'admin-contacts' %}" 
               class="flex items-center gap-3 py-3 px-4 rounded-xl transition-all duration-200 {% if '/contacts' in request.path %} bg-gradient-to-r from-[#bd69f5] to-pink-500 text-white font-bold shadow-lg shadow-[#bd69f5]/25 {% else %} text-gray-400 hover:bg-gray-800 hover:text-white {% endif %}">
                <i class="fa-solid fa-envelope-open-text text-base"></i>
                <span>Messages Inbox</span>
            </a>
        </nav>
    </div>

    <!-- Footer Actions -->
    <div class="p-4 border-t border-gray-800 space-y-2">
        <a href="/" target="_blank"
           class="flex items-center gap-3 py-2.5 px-4 rounded-xl text-sm font-semibold text-gray-400 hover:bg-gray-800 hover:text-white transition">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
            <span>Visit Site</span>
        </a>

        {% if user.is_authenticated %}
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" 
                    class="w-full flex items-center gap-3 py-2.5 px-4 rounded-xl text-sm font-bold text-rose-400 hover:bg-rose-500/10 hover:text-rose-300 transition">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </button>
        </form>
        {% endif %}
    </div>
</aside>
